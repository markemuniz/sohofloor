<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoHo Floor Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0a0a0b; --frame:#141416; --tile:#1d1d20; --ink:#f3f1ea;
    --R:#e2412f; --O:#f08a24; --Y:#f5c518; --G:#2fa35b; --B:#2c6fd6; --V:#7d4fd1; --W:#f3f1ea; --K:#0e0e10;
    --panel:#17171b; --line:#2b2b32; --muted:#9a9aa3; --accent:#f5c518; --danger:#ff6b5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body.tv{overflow:hidden;cursor:none;height:100%}

  /* ---------- Board ---------- */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .frame{background:var(--frame);border-radius:calc(var(--cw)*.35);padding:calc(var(--cw)*.55);display:inline-block;
    box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.5)}
  .grid{display:grid;grid-template-columns:repeat(30,var(--cw));grid-auto-rows:calc(var(--cw)*1.32);gap:calc(var(--cw)*.12)}
  .cell{position:relative;background:var(--tile);border-radius:calc(var(--cw)*.08);overflow:hidden;perspective:400px}
  .cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(1px,calc(var(--cw)*.03));background:rgba(0,0,0,.55);z-index:2}
  .flap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"Barlow Condensed",Helvetica,Arial,sans-serif;font-weight:700;font-size:calc(var(--cw)*1.02);line-height:1;color:var(--ink)}
  .flap.go{animation:flip 90ms ease-in-out}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(80deg);filter:brightness(.6)}100%{transform:rotateX(0)}}
  .flap.c-R{background:var(--R)} .flap.c-O{background:var(--O)} .flap.c-Y{background:var(--Y)} .flap.c-G{background:var(--G)}
  .flap.c-B{background:var(--B)} .flap.c-V{background:var(--V)} .flap.c-W{background:var(--W)} .flap.c-K{background:var(--K)}
  .flap.ph{background-color:#fff;background-repeat:no-repeat}
  /* ---------- Departure-board styling (TV) ---------- */
  body.tv .frame{background:linear-gradient(180deg,#1b1b1d,#0c0c0d);border-radius:calc(var(--cw)*.25);
    padding:calc(var(--cw)*.45) calc(var(--cw)*.55) calc(var(--cw)*.35);
    box-shadow:0 0 0 calc(var(--cw)*.12) #2a2a2d, 0 0 0 calc(var(--cw)*.2) #070708, 0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06)}
  body.tv .cell{background:linear-gradient(180deg,#242427 0%,#1c1c1e 49.5%,#141416 50.5%,#19191b 100%);border-radius:calc(var(--cw)*.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.6)}
  body.tv .cell::before{content:"";position:absolute;top:calc(50% - var(--cw)*.07);width:calc(var(--cw)*.07);height:calc(var(--cw)*.14);background:#08080a;border-radius:1px;left:0;z-index:3;box-shadow:calc(var(--cw)*.93) 0 0 #08080a}
  body.tv .flap{color:#f2efe6;text-shadow:0 1px 0 rgba(0,0,0,.6)}
  .hdr,.ftr{width:0;min-width:100%;overflow:hidden;gap:calc(var(--cw)*1.2);display:flex;align-items:center;justify-content:space-between;font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;white-space:nowrap}
  .hdr{color:#7cc8f5;font-size:calc(var(--cw)*1.05);letter-spacing:.22em;padding:0 calc(var(--cw)*.1) calc(var(--cw)*.4);margin-bottom:calc(var(--cw)*.45);border-bottom:calc(var(--cw)*.06) solid #7cc8f5}
  .hdr .dep{display:flex;align-items:center;gap:calc(var(--cw)*.5)}
  .hdr svg{width:calc(var(--cw)*1.3);height:calc(var(--cw)*1.3);fill:#7cc8f5;transform:rotate(45deg)}
  .hdr .mid{color:#f2efe6;letter-spacing:.25em;font-size:.8em}
  .hdr .mid .re{display:inline-block;transform:scaleX(-1)}
  .hdr .clk{font-variant-numeric:tabular-nums;color:#f2efe6;background:#000;padding:calc(var(--cw)*.1) calc(var(--cw)*.4);border-radius:calc(var(--cw)*.1);letter-spacing:.12em}
  .ftr{color:#8d8a83;font-size:calc(var(--cw)*.62);letter-spacing:.2em;margin-top:calc(var(--cw)*.4);padding-top:calc(var(--cw)*.3);border-top:1px solid #2c2c2f}
  .hdr>span,.ftr>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hdr>span.clk,.hdr>span.dep{flex:none}
  .ftr b{color:#7cc8f5;font-weight:700;margin-left:calc(var(--cw)*.35)}
  .ftr .blink{display:inline-block;width:calc(var(--cw)*.35);height:calc(var(--cw)*.35);border-radius:50%;background:#2fa35b;margin-right:calc(var(--cw)*.35);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .hint{position:fixed;bottom:10px;right:14px;font-size:12px;color:#55555c;opacity:0;transition:opacity .4s}
  body.tv:hover .hint{opacity:1}

  /* ---------- Editor ---------- */
  body.admin{cursor:auto}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-size:28px;letter-spacing:.04em;margin:0}
  .top h1 span{color:var(--accent)}
  .status{font-size:13px;color:var(--muted)} .status.ok{color:#5fd38a} .status.warn{color:var(--O)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  h2{font-size:15px;margin:26px 0 10px;font-weight:700}
  button,input,select,textarea{font:inherit;color:var(--ink)}
  button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#222229;padding:10px 14px}
  button:hover{background:#2b2b34}
  .btn-pri{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
  .btn-pri:hover{background:#ffd43a}
  .btn-link{background:none;border:none;color:var(--muted);padding:6px 8px}
  .btn-del{background:none;border-color:#4a2622;color:var(--danger)}

  .add{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:620px){.add{grid-template-columns:repeat(2,1fr)}}
  .add button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;text-align:left;border-radius:14px;background:var(--panel)}
  .add b{font-size:15px} .add small{color:var(--muted);font-size:12px;line-height:1.35}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}

  .cards{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .card.off{opacity:.45}
  .card .mini{--cw:8px;flex:none;cursor:pointer}
  @media (max-width:520px){.card{flex-direction:column;align-items:stretch}.card .mini{--cw:calc((100vw - 90px)/34.7)}}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .card .kind{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .card .when{font-size:12px;color:var(--muted)}
  .card .when.exp{color:var(--O)}
  .card .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .card .acts button{padding:7px 12px;font-size:13px}

  .switch{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch i{width:38px;height:22px;border-radius:99px;background:#3a3a44;position:relative;transition:.2s}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + i{background:#2fa35b}
  .switch input:checked + i::after{left:19px}

  .settings{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .settings label{display:flex;align-items:center;gap:8px;font-size:14px}
  select,input[type=text],input[type=date],textarea{background:#0f0f12;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  .settings select{width:auto}
  .empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
  .local{margin-top:28px;font-size:13px;color:var(--O);background:#2a1d0f;border:1px solid #4a3418;border-radius:10px;padding:10px 12px}

  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:10}
  .sheet{background:#121216;border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:18px}
  .sheet h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
  .sheet .pv{--cw:clamp(9px,calc((100vw - 90px)/34.7),24px);display:flex;justify-content:center;margin-bottom:6px}
  .warn{font-size:13px;color:var(--O);min-height:18px;text-align:center;margin-bottom:6px}
  .field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .field > span{font-size:13px;font-weight:600}
  .field em{font-style:normal;color:var(--muted);font-weight:400}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.two{grid-template-columns:1fr}}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .colors button{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid transparent}
  .colors button.sel{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
  .colors .none{background:#222;color:var(--muted);font-size:11px}
  .lines input{text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
  .count{font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
  .sheet-acts{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
</style>
</head>

/* ---------------- Turn a message into board text ---------------- */
function compose(m){
  const c=m.color||'', f=m.f||{};
  const head=t=> c ? `{${c}} ${t} {${c}}` : t;
  let L=[];
  if(m.kind==='spotlight'){
    L=[head((f.head||((f.cat||'')+' PICK')).trim()), f.name, f.brand,
       f.price ? '$'+String(f.price).replace(/^\$/,'') : '', f.note];
  } else if(m.kind==='deal'){
    L=[c?`{${c}}{${c}} DEAL {${c}}{${c}}`:'DEAL', f.headline, f.item, f.fine, m.until?'ENDS '+niceDate(m.until):''];
  } else if(m.kind==='fact'){
    L=[head('TTA FUN FACT'), f.fact];
  } else {
    const lines=(f.lines||[]).map(s=>s||'');
    while(lines.length && !lines[lines.length-1].trim()) lines.pop();
    while(lines.length && !lines[0].trim()) lines.shift();
    if(c && lines.length<=4){ const bar=('{'+c+'}').repeat(COLS); return [bar].concat(lines,[bar]).join('\n'); }
    return lines.join('\n');
  }
  return L.filter(x=>x && String(x).trim()).join('\n');
}

/* ---------------- Text -> 6x22 grid ---------------- */
function normalize(s){
  return String(s||'').toUpperCase().replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—·]/g,'-').replace(/…/g,'...')
    // Brand touch: backwards E's whenever TRAVEL AGENCY is spelled out
    .replace(/TRAVEL(\s+)AGENCY/g,'TRAV{E}L$1AG{E}NCY');
}
function tokenize(line){
  const out=[]; const re=/\{([ROYGBVWKE])\}|./g; let m;
  while((m=re.exec(line))){ if(m[1]) out.push('{'+m[1]+'}'); else out.push(CHARS.includes(m[0])?m[0]:' '); }
  return out;
}
function wrap(tokens, W=COLS){
  if(tokens.length<=W) return [tokens];
  const lines=[]; let cur=[], word=[];
  const flush=()=>{ if(!word.length) return;
    if(cur.length && cur.length+1+word.length>W){ lines.push(cur); cur=[]; }
    if(cur.length) cur.push(' ');
    while(word.length>W){ lines.push(word.slice(0,W)); word=word.slice(W); }
    cur=cur.concat(word); word=[]; };
  tokens.forEach(t=>{ if(t===' ') flush(); else word.push(t); });
  flush(); if(cur.length) lines.push(cur);
  return lines;
}
function layout(text){
  let lines=[]; normalize(text).split('\n').forEach(p=>{ lines=lines.concat(wrap(tokenize(p))); });
  while(lines.length && !lines[0].length) lines.shift();
  while(lines.length && !lines[lines.length-1].length) lines.pop();
  const overflow=lines.length>ROWS;
  lines=lines.slice(0,ROWS).map(l=>{ while(l.length && l[l.length-1]===' ') l=l.slice(0,-1); while(l.length && l[0]===' ') l=l.slice(1); return l; });
  const top=Math.floor((ROWS-lines.length)/2);
  const grid=Array.from({length:ROWS},()=>Array(COLS).fill(' '));
  lines.forEach((l,i)=>{ const left=Math.floor((COLS-l.length)/2); l.forEach((t,j)=>{ grid[top+i][left+j]=t; }); });
  return {grid, overflow};
}

function spotGrid(m){

  const grid=Array.from({length:ROWS},()=>Array(COLS).fill(' '));
  const RW=PHOTO.cols*1.12-.12, RH=PHOTO.rows*1.44-.12, ar=AR[f.img]||1;
  let BW=RW, BH=RW*ar; if(BH>RH){ BH=RH; BW=RH/ar; }
  const ox=(RW-BW)/2, oy=(RH-BH)/2;
  const photo={url:f.img, cells:{}};
  for(let i=0;i<PHOTO.rows;i++) for(let j=0;j<PHOTO.cols;j++){
    const y=i*1.44, x=j*1.12;
    if(y+1.32<=oy+.05 || y>=oy+BH-.05 || x+1<=ox+.05 || x>=ox+BW-.05) continue;
    const r=PHOTO.r0+i, cc=PHOTO.c0+j; grid[r][cc]='{I}';
    photo.cells[r*COLS+cc]=`background-image:url("${f.img}");background-size:calc(var(--cw)*${BW.toFixed(3)}) calc(var(--cw)*${BH.toFixed(3)});background-position:calc(var(--cw)*${(ox-x).toFixed(3)}) calc(var(--cw)*${(oy-y).toFixed(3)})`;
  }
  // ring of leaf tiles around the photo (every other tile)
  let r0=99,r1=-1,c0=99,c1=-1;
  for(let r=0;r<ROWS;r++) for(let cc=0;cc<COLS;cc++) if(grid[r][cc]==='{I}'){ r0=Math.min(r0,r); r1=Math.max(r1,r); c0=Math.min(c0,cc); c1=Math.max(c1,cc); }
  if(r1>=0){
    for(let r=r0-1;r<=r1+1;r++) for(let cc=c0-1;cc<=c1+1;cc++){
      if(r<0||r>=ROWS||cc<0||cc>=TXT.c0-1) continue;
      const edge=r===r0-1||r===r1+1||cc===c0-1||cc===c1+1;
      if(edge && (r+cc)%2===0 && grid[r][cc]===' ') grid[r][cc]='{L}';
    }
  }
  const T=s=>tokenize(normalize(s||''));
  const hd=(f.head||((f.cat||'')+' PICK')).trim();
  let head=T(c?`{${c}} ${hd} {${c}}`:hd); if(head.length>W) head=T(hd);
  const name=wrap(T(f.name),W), brand=f.brand?wrap(T(f.brand),W):[], size=f.size?wrap(T(f.size),W):[];
  const price=f.price?T('$'+String(f.price).replace(/^\$/,'')):null;
  let desc=f.desc?wrap(T(f.desc),W):[];
  let top=[head,[]].concat(name,brand,size);
  let room=TXT.rows-top.length-(price?2:0)-1;
  if(desc.length>room && size.length){ top=top.slice(0,top.length-size.length); room+=size.length; }
  if(desc.length>room){
    // keep as many whole sentences as fit; otherwise cut on a word with "..."
    const sents=normalize(f.desc).match(/[^.!?]+[.!?]+/g)||[];
    let best=[];
    for(let k=1;k<=sents.length;k++){ const w=wrap(T(sents.slice(0,k).join('').trim()),W); if(w.length<=room) best=w; else break; }
    if(best.length) desc=best;
    else { desc=desc.slice(0,Math.max(0,room)); const l=desc[desc.length-1]; if(l){ while(l.length>W-3) l.pop(); while(l.length && l[l.length-1]!==' ') l.pop(); l.push('.','.','.'); } }
  }
  let out=top.concat(desc.length?[[]].concat(desc):[]);
  if(price) out=out.concat([[],price]);
  const startRow=TXT.r0+Math.max(0,Math.floor((TXT.rows-out.length)/2));
  out.slice(0,TXT.rows).forEach((l,i)=>{ l.slice(0,W).forEach((t,j)=>{ grid[startRow+i][TXT.c0+j]=t; }); });
  return {grid, photo, overflow:false};
}
function render(m){
  if(m.clock) return layout(clockText());
  if(m.kind==='spotlight' && m.f && m.f.img) return spotGrid(m);
  return layout(compose(m));
}

/* ---------------- Board renderer ---------------- */
function makeBoard(container){
  const frame=document.createElement('div'); frame.className='frame';
  const g=document.createElement('div'); g.className='grid'; frame.appendChild(g); container.appendChild(frame);
  const cells=[];
  for(let i=0;i<ROWS*COLS;i++){
    const cell=document.createElement('div'); cell.className='cell';
    const f=document.createElement('div'); f.className='flap'; cell.appendChild(f); g.appendChild(cell);
    cells.push({el:f, cur:' ', curBg:'', bg:'', queue:[], delay:0});
  }
  const paint=(cell,tok)=>{ cell.cur=tok; cell.el.style.cssText='';
    if(tok==='{I}'){ cell.curBg=cell.bg; cell.el.className='flap ph'; cell.el.textContent=''; cell.el.style.cssText=cell.bg; }
    else if(tok==='{L}'){ cell.el.className='flap'; cell.el.innerHTML=LEAF_SVG; }
    else if(tok==='{E}'){ cell.el.className='flap'; cell.el.innerHTML='<span style="display:inline-block;transform:scaleX(-1)">E</span>'; }
    else if(tok.length>1){ cell.el.className='flap c-'+tok[1]; cell.el.textContent=''; }
    else { cell.el.className='flap'; cell.el.textContent=tok===' '?'':tok; } };
  let timer=null;
  function tick(){
    let busy=false;
    cells.forEach(cell=>{ if(!cell.queue.length) return; busy=true;
      if(cell.delay>0){ cell.delay--; return; }
      paint(cell, cell.queue.shift()); cell.el.classList.remove('go'); void cell.el.offsetWidth; cell.el.classList.add('go'); });
    if(!busy){ clearInterval(timer); timer=null; }
  }
  return { show(grid, instant, photo){
    cells.forEach((cell,i)=>{
      const target=grid[Math.floor(i/COLS)][i%COLS]; cell.queue=[];
      cell.bg=(target==='{I}' && photo) ? (photo.cells[i]||'') : '';
      if(instant){ paint(cell,target); return; }
      if(target===cell.cur && (target!=='{I}' || cell.bg===cell.curBg)) return;
      let from=FLAPS.indexOf(cell.cur), to=FLAPS.indexOf(target);
      if(from===to) from=(to-12+FLAPS.length)%FLAPS.length;
      const dist=(to-from+FLAPS.length)%FLAPS.length||FLAPS.length, steps=Math.min(dist, 10+Math.floor(Math.random()*8));
      for(let s=steps-1;s>=0;s--) cell.queue.push(FLAPS[(to-s+FLAPS.length)%FLAPS.length]);
      cell.delay=(i%COLS)+Math.floor(Math.random()*4);
    });
    if(!instant && !timer) timer=setInterval(tick,55);
  }};
}

/* ---------------- Storage ---------------- */
const USE_FB = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE') && window.firebase;
const LS_KEY='sohofloor_v5';
let docRef=null;
const store={
  listen(cb){
    if(USE_FB){
      firebase.initializeApp(FIREBASE_CONFIG);
      docRef=firebase.firestore().collection('floorboard').doc('main');
      docRef.onSnapshot(s=>{ if(!s.exists){ docRef.set(DEFAULT_STATE); cb(structuredClone(DEFAULT_STATE)); } else { const d=s.data(); if(!d.factsV1){ docRef.set(addFacts(d)); return; } cb(d); } },
        err=>{ console.error(err); setStatus('Connection problem','warn'); });
    } else {
      const read=()=>{ try{ const st=JSON.parse(localStorage.getItem(LS_KEY)); if(st && !st.factsV1){ addFacts(st); try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); }catch(e){} } return st || structuredClone(DEFAULT_STATE); }catch(e){ return structuredClone(DEFAULT_STATE); } };
      cb(read()); addEventListener('storage',e=>{ if(e.key===LS_KEY) cb(read()); });
    }
  },
  save(state){
    if(USE_FB) return docRef.set(state);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    return Promise.resolve();
  }
};

  const keyOf=m=>m.clock?'clock':m.id;

  function reshuffle(list){
    const a=list.slice();
    if(state.settings?.shuffle!==false){
      for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      if(a.length>1 && keyOf(a[0])===lastKey) [a[0],a[1]]=[a[1],a[0]];

    const sig=list.map(keyOf).sort().join();
    if(order.sig!==sig){ order=reshuffle(list); order.sig=sig; idx=-1; }
    idx+=step;
    if(idx>=order.length){ order=reshuffle(list); order.sig=sig; idx=0; }
    if(idx<0) idx=order.length-1;

    (s.messages||[]).forEach(m=>{ if(m.f&&m.f.img) loadAR(m.f.img); });
    if(first) next(1); });

  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(1); if(e.key==='ArrowLeft') next(-1); });
  setTimeout(()=>location.reload(), 6*60*60*1000);
}

    $('secs').value=String(state.settings.seconds||15); $('clock').checked=!!state.settings.clock; $('shuffle').checked=state.settings.shuffle!==false;
    if(!editing) renderCards();
    setStatus(USE_FB?'Live ✓':'', USE_FB?'ok':'');
  });
}

if(new URLSearchParams(location.search).has('admin')) startAdmin(); else startTV();
</script>
