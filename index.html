<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoHo Floor Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0a0a0b; --frame:#141416; --tile:#1d1d20; --ink:#f3f1ea;
    --R:#e2412f; --O:#f08a24; --Y:#f5c518; --G:#2fa35b; --B:#2c6fd6; --V:#7d4fd1; --W:#f3f1ea; --K:#0e0e10;
    --panel:#17171b; --line:#2b2b32; --muted:#9a9aa3; --accent:#f5c518; --danger:#ff6b5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body.tv{overflow:hidden;cursor:none;height:100%}

  /* ---------- Board ---------- */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .frame{background:var(--frame);border-radius:calc(var(--cw)*.35);padding:calc(var(--cw)*.55);display:inline-block;
    box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.5)}
  .grid{display:grid;grid-template-columns:repeat(22,var(--cw));grid-auto-rows:calc(var(--cw)*1.32);gap:calc(var(--cw)*.12)}
  .cell{position:relative;background:var(--tile);border-radius:calc(var(--cw)*.08);overflow:hidden;perspective:400px}
  .cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(1px,calc(var(--cw)*.03));background:rgba(0,0,0,.55);z-index:2}
  .flap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"Barlow Condensed",Helvetica,Arial,sans-serif;font-weight:700;font-size:calc(var(--cw)*1.02);line-height:1;color:var(--ink)}
  .flap.go{animation:flip 90ms ease-in-out}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(80deg);filter:brightness(.6)}100%{transform:rotateX(0)}}
  .flap.c-R{background:var(--R)} .flap.c-O{background:var(--O)} .flap.c-Y{background:var(--Y)} .flap.c-G{background:var(--G)}
  .flap.c-B{background:var(--B)} .flap.c-V{background:var(--V)} .flap.c-W{background:var(--W)} .flap.c-K{background:var(--K)}
  .hint{position:fixed;bottom:10px;right:14px;font-size:12px;color:#55555c;opacity:0;transition:opacity .4s}
  body.tv:hover .hint{opacity:1}

  /* ---------- Editor ---------- */
  body.admin{cursor:auto}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-size:28px;letter-spacing:.04em;margin:0}
  .top h1 span{color:var(--accent)}
  .status{font-size:13px;color:var(--muted)} .status.ok{color:#5fd38a} .status.warn{color:var(--O)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  h2{font-size:15px;margin:26px 0 10px;font-weight:700}
  button,input,select,textarea{font:inherit;color:var(--ink)}
  button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#222229;padding:10px 14px}
  button:hover{background:#2b2b34}
  .btn-pri{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
  .btn-pri:hover{background:#ffd43a}
  .btn-link{background:none;border:none;color:var(--muted);padding:6px 8px}
  .btn-del{background:none;border-color:#4a2622;color:var(--danger)}

  .add{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:620px){.add{grid-template-columns:repeat(2,1fr)}}
  .add button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;text-align:left;border-radius:14px;background:var(--panel)}
  .add b{font-size:15px} .add small{color:var(--muted);font-size:12px;line-height:1.35}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}

  .cards{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .card.off{opacity:.45}
  .card .mini{--cw:8px;flex:none;cursor:pointer}
  @media (max-width:520px){.card{flex-direction:column;align-items:stretch}.card .mini{--cw:calc((100vw - 90px)/24.6)}}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .card .kind{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .card .when{font-size:12px;color:var(--muted)}
  .card .when.exp{color:var(--O)}
  .card .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .card .acts button{padding:7px 12px;font-size:13px}

  .switch{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch i{width:38px;height:22px;border-radius:99px;background:#3a3a44;position:relative;transition:.2s}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + i{background:#2fa35b}
  .switch input:checked + i::after{left:19px}

  .settings{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .settings label{display:flex;align-items:center;gap:8px;font-size:14px}
  select,input[type=text],input[type=date],textarea{background:#0f0f12;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  .settings select{width:auto}
  .empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
  .local{margin-top:28px;font-size:13px;color:var(--O);background:#2a1d0f;border:1px solid #4a3418;border-radius:10px;padding:10px 12px}

  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:10}
  .sheet{background:#121216;border:1px solid var(--line);border-radius:18px;width:100%;max-width:640px;padding:18px}
  .sheet h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
  .sheet .pv{--cw:clamp(9px,calc((100vw - 90px)/24.6),24px);display:flex;justify-content:center;margin-bottom:6px}
  .warn{font-size:13px;color:var(--O);min-height:18px;text-align:center;margin-bottom:6px}
  .field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .field > span{font-size:13px;font-weight:600}
  .field em{font-style:normal;color:var(--muted);font-weight:400}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.two{grid-template-columns:1fr}}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .colors button{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid transparent}
  .colors button.sel{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
  .colors .none{background:#222;color:var(--muted);font-size:11px}
  .lines input{text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
  .count{font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
  .sheet-acts{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   SoHo Floor Board · The Travel Agency SoHo
   TV view:     markemuniz.github.io/sohofloor
   Editor:      markemuniz.github.io/sohofloor/?admin
   Paste a Firebase web config below to sync the editor and the TV.
   Until then it runs in LOCAL mode (saves only in that browser).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const COLS = 22, ROWS = 6;
const COLORS = ['R','O','Y','G','B','V','W'];
const CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890!@#$()-+&=;:'\"%,./?°".split('');
const FLAPS = CHARS.concat(['R','O','Y','G','B','V','W','K'].map(c => '{'+c+'}'), ['{E}']);

const KINDS = {
  spotlight:{label:'Product Spotlight', help:'Feature a product', color:'B'},
  deal:     {label:'Deal', help:'A sale or promo', color:'R'},
  fact:     {label:'Fun Fact', help:'Something about TTA', color:'V'},
  note:     {label:'Message', help:'Anything else, line by line', color:'G'}
};
const CATS = ['Flower','Pre-Roll','Vape','Edible','Concentrate','Beverage','Tincture','Topical','Accessory',''];

function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isLive(m){ return m.on && (!m.until || todayStr() <= m.until); }
function niceDate(s){ if(!s) return ''; const [y,mo,d]=s.split('-'); return (+mo)+'/'+(+d); }

const DEFAULT_STATE = {
  settings:{ seconds:15, clock:true },
  messages:[
    {id:uid(), kind:'note', on:true, until:'', color:'G', f:{lines:['WELCOME TO','THE TRAVEL AGENCY','SOHO','','','']}},
    {id:uid(), kind:'spotlight', on:true, until:'', color:'B', f:{cat:'Flower', name:'Product name', brand:'Brand', price:'', note:'Ask your budtender'}},
    {id:uid(), kind:'deal', on:true, until:'', color:'R', f:{headline:'20% off', item:"What's on sale", fine:''}},
    {id:uid(), kind:'fact', on:true, until:'', color:'V', f:{fact:'Add a fun fact about The Travel Agency here'}},
    {id:uid(), kind:'note', on:true, until:'', color:'Y', f:{lines:['MUST BE 21+ WITH','VALID ID TO PURCHASE','','','','']}}
  ]
};

/* ---------------- Turn a message into board text ---------------- */
function compose(m){
  const c=m.color||'', f=m.f||{};
  const head=t=> c ? `{${c}} ${t} {${c}}` : t;
  let L=[];
  if(m.kind==='spotlight'){
    L=[head(((f.cat||'')+' PICK').trim()), f.name, f.brand,
       [f.price ? '$'+String(f.price).replace(/^\$/,'') : '', ''].join(''), f.note];
  } else if(m.kind==='deal'){
    L=[c?`{${c}}{${c}} DEAL {${c}}{${c}}`:'DEAL', f.headline, f.item, f.fine, m.until?'ENDS '+niceDate(m.until):''];
  } else if(m.kind==='fact'){
    L=[head('TTA FUN FACT'), f.fact];
  } else {
    const lines=(f.lines||[]).map(s=>s||'');
    while(lines.length && !lines[lines.length-1].trim()) lines.pop();
    while(lines.length && !lines[0].trim()) lines.shift();
    if(c && lines.length<=4){ const bar=('{'+c+'}').repeat(COLS); return [bar].concat(lines,[bar]).join('\n'); }
    return lines.join('\n');
  }
  return L.filter(x=>x && String(x).trim()).join('\n');
}

/* ---------------- Text -> 6x22 grid ---------------- */
function normalize(s){
  return String(s||'').toUpperCase().replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-').replace(/…/g,'...')
    // Brand touch: backwards E's whenever TRAVEL AGENCY is spelled out
    .replace(/TRAVEL(\s+)AGENCY/g,'TRAV{E}L$1AG{E}NCY');
}
function tokenize(line){
  const out=[]; const re=/\{([ROYGBVWKE])\}|./g; let m;
  while((m=re.exec(line))){ if(m[1]) out.push('{'+m[1]+'}'); else out.push(CHARS.includes(m[0])?m[0]:' '); }
  return out;
}
function wrap(tokens){
  if(tokens.length<=COLS) return [tokens];
  const lines=[]; let cur=[], word=[];
  const flush=()=>{ if(!word.length) return;
    if(cur.length && cur.length+1+word.length>COLS){ lines.push(cur); cur=[]; }
    if(cur.length) cur.push(' ');
    while(word.length>COLS){ lines.push(word.slice(0,COLS)); word=word.slice(COLS); }
    cur=cur.concat(word); word=[]; };
  tokens.forEach(t=>{ if(t===' ') flush(); else word.push(t); });
  flush(); if(cur.length) lines.push(cur);
  return lines;
}
function layout(text){
  let lines=[]; normalize(text).split('\n').forEach(p=>{ lines=lines.concat(wrap(tokenize(p))); });
  while(lines.length && !lines[0].length) lines.shift();
  while(lines.length && !lines[lines.length-1].length) lines.pop();
  const overflow=lines.length>ROWS;
  lines=lines.slice(0,ROWS).map(l=>{ while(l.length && l[l.length-1]===' ') l=l.slice(0,-1); while(l.length && l[0]===' ') l=l.slice(1); return l; });
  const top=Math.floor((ROWS-lines.length)/2);
  const grid=Array.from({length:ROWS},()=>Array(COLS).fill(' '));
  lines.forEach((l,i)=>{ const left=Math.floor((COLS-l.length)/2); l.forEach((t,j)=>{ grid[top+i][left+j]=t; }); });
  return {grid, overflow};
}

/* ---------------- Board renderer ---------------- */
function makeBoard(container){
  const frame=document.createElement('div'); frame.className='frame';
  const g=document.createElement('div'); g.className='grid'; frame.appendChild(g); container.appendChild(frame);
  const cells=[];
  for(let i=0;i<ROWS*COLS;i++){
    const cell=document.createElement('div'); cell.className='cell';
    const f=document.createElement('div'); f.className='flap'; cell.appendChild(f); g.appendChild(cell);
    cells.push({el:f, cur:' ', queue:[], delay:0});
  }
  const paint=(cell,tok)=>{ cell.cur=tok;
    if(tok==='{E}'){ cell.el.className='flap'; cell.el.innerHTML='<span style="display:inline-block;transform:scaleX(-1)">E</span>'; }
    else if(tok.length>1){ cell.el.className='flap c-'+tok[1]; cell.el.textContent=''; }
    else { cell.el.className='flap'; cell.el.textContent=tok===' '?'':tok; } };
  let timer=null;
  function tick(){
    let busy=false;
    cells.forEach(cell=>{ if(!cell.queue.length) return; busy=true;
      if(cell.delay>0){ cell.delay--; return; }
      paint(cell, cell.queue.shift()); cell.el.classList.remove('go'); void cell.el.offsetWidth; cell.el.classList.add('go'); });
    if(!busy){ clearInterval(timer); timer=null; }
  }
  return { show(grid, instant){
    cells.forEach((cell,i)=>{
      const target=grid[Math.floor(i/COLS)][i%COLS]; cell.queue=[];
      if(instant){ paint(cell,target); return; }
      if(target===cell.cur) return;
      const from=FLAPS.indexOf(cell.cur), to=FLAPS.indexOf(target);
      const dist=(to-from+FLAPS.length)%FLAPS.length, steps=Math.min(dist, 10+Math.floor(Math.random()*8));
      for(let s=steps-1;s>=0;s--) cell.queue.push(FLAPS[(to-s+FLAPS.length)%FLAPS.length]);
      cell.delay=(i%COLS)+Math.floor(Math.random()*4);
    });
    if(!instant && !timer) timer=setInterval(tick,55);
  }};
}

/* ---------------- Storage ---------------- */
const USE_FB = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE') && window.firebase;
const LS_KEY='sohofloor_v2';
let docRef=null;
const store={
  listen(cb){
    if(USE_FB){
      firebase.initializeApp(FIREBASE_CONFIG);
      docRef=firebase.firestore().collection('floorboard').doc('main');
      docRef.onSnapshot(s=>{ if(!s.exists){ docRef.set(DEFAULT_STATE); cb(structuredClone(DEFAULT_STATE)); } else cb(s.data()); },
        err=>{ console.error(err); setStatus('Connection problem','warn'); });
    } else {
      const read=()=>{ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || structuredClone(DEFAULT_STATE); }catch(e){ return structuredClone(DEFAULT_STATE); } };
      cb(read()); addEventListener('storage',e=>{ if(e.key===LS_KEY) cb(read()); });
    }
  },
  save(state){
    if(USE_FB) return docRef.set(state);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    return Promise.resolve();
  }
};

/* ---------------- TV ---------------- */
function clockText(){
  const d=new Date();
  return "{Y}{O}{R}{V}{B}{G}\n"+d.toLocaleDateString('en-US',{weekday:'long'})+"\n"+
    d.toLocaleDateString('en-US',{month:'long',day:'numeric'})+"\n"+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+"\n{G}{B}{V}{R}{O}{Y}";
}
function startTV(){
  document.body.className='tv';
  document.getElementById('app').innerHTML='<div class="stage" id="stage"></div><div class="hint">Click for fullscreen · arrow keys to skip</div>';
  const fit=()=>{ const byW=innerWidth*.94/(COLS*1.12+1.1), byH=innerHeight*.9/(ROWS*1.32+(ROWS-1)*.12+1.1);
    document.documentElement.style.setProperty('--cw', Math.floor(Math.min(byW,byH))+'px'); };
  fit(); addEventListener('resize',fit);
  const board=makeBoard(document.getElementById('stage'));
  let state=null, idx=-1, timer=null;
  const playlist=()=>{ const l=(state.messages||[]).filter(isLive).map(m=>compose(m)); if(state.settings?.clock && l.length) l.push('__clock'); return l; };
  function next(step=1){
    clearTimeout(timer); const list=playlist();
    if(!list.length){ board.show(layout("THE TRAVEL AGENCY\nSOHO").grid); return; }
    idx=(idx+step+list.length)%list.length;
    board.show(layout(list[idx]==='__clock'?clockText():list[idx]).grid);
    timer=setTimeout(()=>next(1), Math.max(5,+state.settings?.seconds||15)*1000);
  }
  store.listen(s=>{ const first=!state; state=s; if(first) next(1); });
  document.addEventListener('click',()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); });
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') next(1); if(e.key==='ArrowLeft') next(-1); });
  setTimeout(()=>location.reload(), 6*60*60*1000);
}

/* ---------------- Editor ---------------- */
let statusEl=null;
function setStatus(t,cls){ if(statusEl){ statusEl.textContent=t; statusEl.className='status '+(cls||''); } }

function startAdmin(){
  document.body.className='admin';
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="wrap">
    <div class="top">
      <h1>FLOOR BOARD <span>EDITOR</span></h1>
      <span class="status" id="status"></span>
    </div>
    <p class="sub">Add what you want customers to see. The board on the TV cycles through everything that's switched on.</p>

    <h2>Add to the board</h2>
    <div class="add">
      ${Object.entries(KINDS).map(([k,v])=>`<button data-add="${k}"><span class="dot" style="background:var(--${v.color})"></span><b>${v.label}</b><small>${v.help}</small></button>`).join('')}
    </div>

    <h2>On the board now</h2>
    <div class="cards" id="cards"></div>

    <h2>Board settings</h2>
    <div class="settings">
      <label>Show each message for
        <select id="secs">${[8,10,15,20,30,45,60].map(s=>`<option value="${s}">${s} seconds</option>`).join('')}</select>
      </label>
      <label class="switch"><input type="checkbox" id="clock"><i></i>Show the date and time</label>
      <button id="openTV">Open the TV board ↗</button>
    </div>
    ${USE_FB?'':'<div class="local">Not synced yet: changes save only on this device until the board is connected to its own Firebase project.</div>'}
  </div>
  <div id="sheetHost"></div>`;
  statusEl=document.getElementById('status');
  const $=id=>document.getElementById(id);
  let state=null, saveT=null, lastLocal=0, editing=null;

  function save(){
    clearTimeout(saveT); setStatus('Saving…');
    saveT=setTimeout(()=>{ lastLocal=Date.now(); store.save(state).then(()=>setStatus('Saved ✓','ok')).catch(e=>setStatus('Could not save','warn')); },400);
  }

  function renderCards(){
    const host=$('cards'); host.innerHTML='';
    if(!state.messages.length){ host.innerHTML='<div class="empty">Nothing on the board yet. Pick something to add above.</div>'; return; }
    state.messages.forEach((m,i)=>{
      const k=KINDS[m.kind]||KINDS.note, expired=m.until && todayStr()>m.until;
      const card=document.createElement('div'); card.className='card'+(isLive(m)?'':' off');
      card.innerHTML=`<div class="mini" title="Edit"></div>
        <div class="info">
          <div class="kind"><span class="dot" style="background:var(--${m.color||'K'})"></span>${k.label}</div>
          <div class="when ${expired?'exp':''}">${expired?'Ended '+niceDate(m.until)+', no longer showing':m.until?'Showing until '+niceDate(m.until):'Showing every cycle'}</div>
          <div class="acts">
            <label class="switch"><input type="checkbox" ${m.on?'checked':''}><i></i>${m.on?'On':'Off'}</label>
            <button data-a="edit">Edit</button>
            <button data-a="up" class="btn-link" ${i===0?'disabled':''} title="Move up">▲</button>
            <button data-a="down" class="btn-link" ${i===state.messages.length-1?'disabled':''} title="Move down">▼</button>
          </div>
        </div>`;
      makeBoard(card.querySelector('.mini')).show(layout(compose(m)).grid,true);
      card.querySelector('.mini').onclick=()=>openSheet(m.id);
      card.querySelector('input').onchange=e=>{ m.on=e.target.checked; renderCards(); save(); };
      card.querySelector('[data-a=edit]').onclick=()=>openSheet(m.id);
      card.querySelector('[data-a=up]').onclick=()=>{ [state.messages[i-1],state.messages[i]]=[state.messages[i],state.messages[i-1]]; renderCards(); save(); };
      card.querySelector('[data-a=down]').onclick=()=>{ [state.messages[i+1],state.messages[i]]=[state.messages[i],state.messages[i+1]]; renderCards(); save(); };
      host.appendChild(card);
    });
  }

  function formFor(m){
    const f=m.f, inp=(key,label,ph,hint)=>`<label class="field"><span>${label}${hint?` <em>${hint}</em>`:''}</span><input type="text" data-k="${key}" value="${esc(f[key])}" placeholder="${esc(ph)}"></label>`;
    if(m.kind==='spotlight') return `
      <label class="field"><span>Category</span><select data-k="cat">${CATS.map(c=>`<option value="${c}" ${f.cat===c?'selected':''}>${c||'(none)'}</option>`).join('')}</select></label>
      ${inp('name','Product name','e.g. Blue Dream 3.5g')}
      <div class="two">${inp('brand','Brand','e.g. Brand name','(optional)')}${inp('price','Price','e.g. 45','(optional)')}</div>
      ${inp('note','Extra line','e.g. Ask your budtender','(optional)')}`;
    if(m.kind==='deal') return `
      ${inp('headline','Headline','e.g. 20% off')}
      ${inp('item',"What's on sale",'e.g. All pre-rolls')}
      ${inp('fine','Fine print','e.g. While supplies last','(optional)')}`;
    if(m.kind==='fact') return `
      <label class="field"><span>The fun fact</span><textarea data-k="fact" rows="3" placeholder="Type the fact. It wraps on its own.">${esc(f.fact)}</textarea></label>`;
    return `<div class="field lines"><span>Your message <em>(one row of the board per box, up to 22 letters each)</em></span>
      ${[0,1,2,3,4,5].map(i=>`<input type="text" maxlength="22" data-line="${i}" value="${esc((f.lines||[])[i]||'')}" placeholder="Row ${i+1}"><div class="count" data-count="${i}"></div>`).join('')}</div>`;
  }

  function openSheet(id){
    const m=state.messages.find(x=>x.id===id); if(!m) return; editing=id;
    const k=KINDS[m.kind]||KINDS.note;
    $('sheetHost').innerHTML=`<div class="sheet-bg"><div class="sheet">
      <h3><span class="dot" style="background:var(--${k.color})"></span>${k.label}</h3>
      <div class="pv" id="pv"></div>
      <div class="warn" id="warn"></div>
      ${formFor(m)}
      <div class="field"><span>Color</span><div class="colors" id="colors">
        ${COLORS.map(c=>`<button data-c="${c}" style="background:var(--${c})" class="${m.color===c?'sel':''}" title="${c}"></button>`).join('')}
        <button data-c="" class="none ${!m.color?'sel':''}">None</button></div></div>
      <div class="two">
        <label class="field"><span>Stop showing after <em>(optional)</em></span><input type="date" id="until" value="${m.until||''}"></label>
        <div class="field"><span>On the board</span><label class="switch"><input type="checkbox" id="on" ${m.on?'checked':''}><i></i>Show it</label></div>
      </div>
      <div class="sheet-acts"><button class="btn-del" id="del">Delete</button><button class="btn-pri" id="done">Done</button></div>
    </div></div>`;
    const pv=makeBoard($('pv'));
    const refresh=(instant)=>{
      const L=layout(compose(m)); pv.show(L.grid,instant);
      $('warn').textContent=L.overflow?'Too much text to fit. Try shortening it.':'';
      document.querySelectorAll('[data-count]').forEach(el=>{ const n=((m.f.lines||[])[+el.dataset.count]||'').length; el.textContent=n?n+'/22':''; });
    };
    refresh(true);
    document.querySelectorAll('.sheet [data-k]').forEach(el=>{ el.addEventListener('input',()=>{ m.f[el.dataset.k]=el.value; refresh(true); save(); }); });
    document.querySelectorAll('.sheet [data-line]').forEach(el=>{ el.addEventListener('input',()=>{ m.f.lines=m.f.lines||['','','','','','']; m.f.lines[+el.dataset.line]=el.value; refresh(true); save(); }); });
    $('colors').querySelectorAll('button').forEach(b=>b.onclick=()=>{ m.color=b.dataset.c; $('colors').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b)); refresh(true); save(); });
    $('until').onchange=e=>{ m.until=e.target.value; refresh(true); save(); };
    $('on').onchange=e=>{ m.on=e.target.checked; save(); };
    const close=()=>{ editing=null; $('sheetHost').innerHTML=''; renderCards(); };
    $('done').onclick=close;
    document.querySelector('.sheet-bg').onclick=e=>{ if(e.target.classList.contains('sheet-bg')) close(); };
    $('del').onclick=()=>{ if(!confirm('Delete this from the board?')) return; state.messages=state.messages.filter(x=>x!==m); save(); close(); };
    const firstInput=document.querySelector('.sheet input[type=text], .sheet textarea'); if(firstInput && innerWidth>700) firstInput.focus();
  }

  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const kind=b.dataset.add, blank={spotlight:{cat:'Flower',name:'',brand:'',price:'',note:''},deal:{headline:'',item:'',fine:''},fact:{fact:''},note:{lines:['','','','','','']}};
    const m={id:uid(), kind, on:true, until:'', color:KINDS[kind].color, f:blank[kind]};
    state.messages.unshift(m); renderCards(); save(); openSheet(m.id);
  });
  $('secs').onchange=e=>{ state.settings.seconds=+e.target.value; save(); };
  $('clock').onchange=e=>{ state.settings.clock=e.target.checked; save(); };
  $('openTV').onclick=()=>window.open(location.pathname,'_blank');

  store.listen(s=>{
    if(state && Date.now()-lastLocal<2000) return;
    state=s; state.settings=state.settings||{seconds:15,clock:true}; state.messages=state.messages||[];
    $('secs').value=String(state.settings.seconds||15); $('clock').checked=!!state.settings.clock;
    if(!editing) renderCards();
    setStatus(USE_FB?'Live ✓':'', USE_FB?'ok':'');
  });
}

if(new URLSearchParams(location.search).has('admin')) startAdmin(); else startTV();
</script>
</body>
</html>
