<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>SoHo Floor Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Customer-facing split-flap board for the sales floor, plus a PIN-locked editor at #admin.
   Same look as the SoHo Board: near-black bezel, charcoal flaps, warm white characters, seven color chips. */
:root{
  --bg:#0D0E10; --panel:#16181C; --panel2:#1E2126; --line:#2A2E35; --text:#ECEDEF; --muted:#9A9FA8; --dim:#5d626b;
  --accent:#F6C21C; --on-accent:#141005; --danger:#FF6B5E; --ok:#3CCB6E;
  --red:#E0362C; --orange:#F47B20; --yellow:#F6C21C; --green:#22A04B; --blue:#2369D6; --violet:#7A3EA1; --white:#F1F0EC;
  --flap-font:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Barlow,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.board-mode{overflow:hidden;cursor:none;background:#070707}
#board{display:block;width:100vw;height:100vh}
#dot{position:fixed;right:10px;bottom:8px;width:7px;height:7px;border-radius:50%;background:#3A3A3A}
#photo{position:fixed;left:0;top:0;width:0;height:0;background:#fff;overflow:hidden;opacity:0;transition:opacity .6s ease;display:flex;flex-direction:column;box-shadow:0 8px 34px rgba(0,0,0,.6);pointer-events:none}
#photo.show{opacity:1}
#photo img{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;padding:6%;box-sizing:border-box;display:block}
#photo .cap{flex:none;background:#101010;color:#F1F0EC;font-family:var(--flap-font);font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:center;line-height:1.2;padding:.65em .8em}
#photo .cap:empty{display:none}
#dot.on{background:#1E6E39}
.gate{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:8px}
.gate h2{font-family:var(--flap-font);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 12px}
.gate form{display:flex;gap:10px}
.gate button{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:0 18px;font-weight:700;font-size:15px}
.gate p{color:var(--danger);font-size:14px;margin:10px 0 0;min-height:18px}
#keepawake{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#nudge{position:fixed;left:0;top:0;width:1px;height:1px;pointer-events:none;opacity:0}

/* ---------- editor ---------- */
#editor{max-width:720px;margin:0 auto;padding:16px 14px 90px}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 12px}
.ed-title{font-family:var(--flap-font);font-weight:600;font-size:23px;white-space:nowrap;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:11px}
.ed-title .bits{display:inline-grid;grid-template-columns:repeat(3,7px);gap:2px}
.ed-title .bits i{width:7px;height:12px;border-radius:1.5px;background:var(--c)}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.live{color:#86e3a2;border-color:#24593a;background:#10231a}
.pill.off{color:#f2ab76;border-color:#5a3b20;background:#24170e}
.now-line{font-size:13px;color:var(--muted);margin:0 2px 12px;min-height:18px}
.now-line b{color:var(--text);font-weight:600}
.hold-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#29230f;border:1px solid #5b4b15;color:#f6d77a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.hold-banner button{background:#f6d77a;color:#1b1607;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.add-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.add-row button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 4px 11px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:7px}
.add-row button i{width:24px;height:5px;border-radius:2px;background:var(--c)}
.add-row button:active{background:var(--panel2)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:14px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card.ontv{border-color:#3b6a49;box-shadow:0 0 0 1px #3b6a49}
.card-top{padding:10px;cursor:pointer}
.mg{position:relative;display:grid;grid-template-columns:repeat(22,1fr);grid-template-rows:repeat(6,auto);gap:2px;background:#090909;padding:7px;border-radius:9px;container-type:inline-size}
.mph{position:absolute;inset:0;background:#fff;border-radius:3px;overflow:hidden}
.mph img{width:100%;height:100%;object-fit:contain;padding:6%;box-sizing:border-box;display:block}
.btns{display:flex;gap:8px}
.fields .filebtn,.btns button{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--text);text-transform:none;letter-spacing:0;cursor:pointer}
.mg i{aspect-ratio:4/7;background:#1d1d1d;border-radius:1.5px;display:flex;align-items:center;justify-content:center;font-family:var(--flap-font);font-weight:600;font-size:10px;font-size:3.6cqw;color:#F1F0EC;font-style:normal;line-height:1;overflow:hidden}
.card.st-off .mg,.card.st-ended .mg,.card.st-empty .mg{opacity:.4}
.meta{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px 3px 7px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--c,#666)}
.chip.feat{--c:var(--yellow)}
.chip.pin{--c:#f6d77a;color:#f6d77a}
.chip.tv{--c:#4fd27a;color:#86e3a2;display:none}
.card.ontv .chip.tv{display:inline-block}
.status{font-size:12.5px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.st-live .status::before{background:#4fd27a}
.st-sched .status::before{background:var(--blue)}
.st-ended .status::before,.st-empty .status::before{background:var(--orange)}

input.tog{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:#3a3a3a;position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0;border:0}
input.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfcbc2;transition:transform .15s}
input.tog:checked{background:var(--ok)}
input.tog:checked::after{transform:translateX(18px);background:#fff}

.fields{padding:12px 12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:13px}
.fields>*{min-width:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fields label,.settings label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fields label.row,.settings label.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.count{font-weight:500;color:var(--dim);letter-spacing:0}
input[type=text],input[type=number],input[type=date],select,textarea{min-width:0;max-width:100%;font:inherit;font-size:16px;color:var(--text);background:#0f0f0f;border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;letter-spacing:0;text-transform:none;font-weight:500}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6b675f}
textarea{resize:vertical;min-height:118px;font-family:var(--flap-font);font-weight:600;text-transform:uppercase;letter-spacing:.05em;line-height:1.35}
input[data-f=header]{font-family:var(--flap-font);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input[type=date]{min-height:44px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f2>label{min-width:0}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:#0f0f0f;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatches button{width:28px;height:38px;border-radius:5px;border:2px solid transparent;background:var(--c);padding:0;box-shadow:inset 0 -12px 0 rgba(0,0,0,.12)}
.swatches button.on{border-color:#fff}
.warn{font-size:13px;color:#f2ab76;display:none;line-height:1.4}
.warn.show{display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.actions button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.actions .primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.actions .danger{color:var(--danger);margin-left:auto}

.settings{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px;margin-top:22px}
.settings h2{font-family:var(--flap-font);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.settings label.row{padding:10px 0;border-top:1px solid var(--line);text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);font-weight:500}
.settings label.row:first-of-type{border-top:0}
.settings input[type=number]{width:90px;text-align:center}
.settings select{width:auto;min-width:130px}
.ed-foot{text-align:center;margin-top:22px}
.ed-foot a{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--text);color:#111;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){ .add-row button{font-size:12px} .actions button{padding:9px 10px} }
</style>
</head>
<body>

  <div id="dot"></div>

</div>

<div id="editor" hidden>
  <header class="ed-head">
    <div class="ed-title"><span class="bits"><i style="--c:var(--green)"></i><i style="--c:var(--orange)"></i><i style="--c:var(--blue)"></i></span>Floor Board</div>
    <span id="ed-status" class="pill">Connecting</span>
  </header>
  <section id="gate" class="gate">
    <h2>Enter PIN</h2>
    <form id="gateForm"><input id="pinInput" type="password" autocomplete="off" placeholder="Manager PIN"><button type="submit">Unlock</button></form>
    <p id="gateMsg"></p>
  </section>
  <div id="ed-main" hidden>
  <div id="ed-now" class="now-line"></div>
  <div id="ed-hold" class="hold-banner" hidden></div>
  <div class="add-row">
    <button data-add="spotlight"><i style="--c:var(--green)"></i>Spotlight</button>
    <button data-add="deal"><i style="--c:var(--orange)"></i>Deal</button>
    <button data-add="fact"><i style="--c:var(--blue)"></i>Fun fact</button>
    <button data-add="custom"><i style="--c:var(--violet)"></i>Custom</button>
  </div>
  <div id="ed-list"></div>
  <section class="settings">
    <h2>Settings</h2>
    <label class="row"><span>Seconds per screen</span><input type="number" id="set-seconds" min="4" max="300" inputmode="numeric"></label>
    <label class="row"><span>Shuffle order</span><input type="checkbox" class="tog" id="set-shuffle"></label>
    <label class="row"><span>Featured screens come up every</span>
      <select id="set-every"><option value="2">2 screens</option><option value="3">3 screens</option><option value="4">4 screens</option><option value="5">5 screens</option><option value="6">6 screens</option></select></label>
    <label class="row"><span>Flip style</span>
      <select id="set-flip"><option value="full">Full flip</option><option value="quick">Quick flip</option></select></label>
  </section>
  <footer class="ed-foot"><a id="open-board" href="./" target="_blank" rel="noopener">Open the board</a></footer>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   SETUP: paste your Firebase web config here so the editor (phone) and
   the TV stay in sync. Leave apiKey blank to run on this device only.
   ===================================================================== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAagyUGnM-kqbiLy5rHjALPp2LtbM8KVmQ",
  authDomain: "soho-board.firebaseapp.com",
  databaseURL: "https://soho-board-default-rtdb.firebaseio.com",
  projectId: "soho-board",
  storageBucket: "soho-board.firebasestorage.app",
  messagingSenderId: "275130060759",
  appId: "1:275130060759:web:121dd51aa3ca891788c592"
};
var DB_PATH = "sohoFloor";      // its own node, separate from the SoHo Board (sohoBoard)
var PIN = "SOHO2026";           // same manager PIN as the SoHo Board admin
var STORE_NAME = "SOHO";
/* ===================================================================== */

const ROWS = 6, COLS = 22;
const COLORS = {R:'#E0362C',O:'#F47B20',Y:'#F6C21C',G:'#22A04B',B:'#2369D6',V:'#7A3EA1',W:'#F1F0EC'};
const COLOR_KEYS = ['R','O','Y','G','B','V','W'];
const COLOR_NAMES = {R:'Red',O:'Orange',Y:'Yellow',G:'Green',B:'Blue',V:'Violet',W:'White'};
const RAINBOW = ['R','O','Y','G','B','V'];
const FLAP = [' '].concat(
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
  '1234567890'.split(''),
  "!@#$()-+&=;:'\"%,./?°".split(''),
  COLOR_KEYS.map(function(k){ return '{' + k + '}'; })
);
const N = FLAP.length;
const IDX = {}; FLAP.forEach(function(v, i){ IDX[v] = i; });
const isColor = function(v){ return v.length === 3; };

const TYPES = {
  spotlight: {label:'Spotlight', header:'PRODUCT SPOTLIGHT', accent:'G', style:'banner'},
  deal:      {label:'Deal',      header:"TODAY'S DEAL",      accent:'O', style:'banner'},
  fact:      {label:'Fun fact',  header:'DID YOU KNOW?',     accent:'B', style:'banner'},
  custom:    {label:'Custom',    header:'',                  accent:'V', style:'plain'}
};
const TYPE_ORDER = ['spotlight','deal','fact','custom'];
const TYPE_COLOR = {spotlight:'G', deal:'O', fact:'B', custom:'V'};
const DEFAULT_SETTINGS = {seconds:15, shuffle:false, featureEvery:3, flip:'full', holdId:''};
const IS_EDITOR = location.hash.replace('#', '').toLowerCase() === 'admin';
window.addEventListener('hashchange', function(){ location.reload(); });

/* ---------- small helpers ---------- */
const $ = function(s, el){ return (el || document).querySelector(s); };
const pad = function(n){ return (n < 10 ? '0' : '') + n; };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDate(s){ if (!s) return ''; const p = s.split('-'); const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(p[1]) - 1]; return m + ' ' + Number(p[2]); }
function newId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function blankGrid(){ const g = []; for (let r = 0; r < ROWS; r++){ const row = []; for (let c = 0; c < COLS; c++) row.push(' '); g.push(row); } return g; }
function gridKey(g){ return g.map(function(r){ return r.join('|'); }).join('/'); }

/* ---------- text to board tiles ---------- */
function normalizeText(s){
  s = String(s || '')
    .replace(/[‘’‚‛′`]/g, "'")
    .replace(/[“”„″]/g, '"')
    .replace(/[‐-―−]/g, '-')

    p.forEach(function(t){ if (t === ' '){ if (w.length) words.push(w); w = []; } else w.push(t); });

function layout(m){

  const hasPhoto = !!String(m.image || '').trim();

  const textCols = hasPhoto ? PHOTO_C0 - 1 : COLS; // text gets the left 13, one column gap

    const ht = tokenize((m.header && m.header.trim()) ? m.header : t.header);
    ht.bad.forEach(function(b){ if (bad.indexOf(b) === -1) bad.push(b); });
    const h = ht.tokens.filter(function(x){ return x !== '\n'; });
    while (h.length && h[0] === ' ') h.shift();
    while (h.length && h[h.length - 1] === ' ') h.pop();

      const H = h.slice(0, COLS), row = g[0];

        row[left] = ' ';
        H.forEach(function(x, i){ row[left + 1 + i] = x; });
        row[left + 1 + H.length] = ' ';
      } else {
        const left2 = Math.floor((COLS - H.length) / 2);

    }

    for (let c = 0; c < COLS; c++){
      g[0][c] = '{' + RAINBOW[c % 6] + '}';

    }

  bt.bad.forEach(function(b){ if (bad.indexOf(b) === -1) bad.push(b); });

  if (style === 'banner' && r0 === 1 && lines.length <= rows - 1){ r0 = 2; rows = r1 - r0 + 1; }
  const overflow = Math.max(0, lines.length - rows);
  lines = lines.slice(0, rows);
  const top = r0 + Math.floor((rows - lines.length) / 2);
  lines.forEach(function(ln, i){
    const start = m.align === 'left' ? 0 : Math.floor((textCols - ln.length) / 2);
    ln.forEach(function(x, j){ g[top + i][start + j] = x; });
  });

}

    const twW = (W * 0.96) / (COLS + (COLS - 1) * GXR + 2 * PADX);
    const twH = (H * 0.93) / (ROWS * ASPECT + (ROWS - 1) * GYR + PADT + PADB);
    tw = Math.max(4, Math.floor(Math.min(twW, twH)));
    th = Math.round(tw * ASPECT);

    const x = ox + R.c0 * (tw + gx), y = oy + R.r0 * (th + gy);
    const w = (nc + 1) * tw + nc * gx, h = (nr + 1) * th + nr * gy;
    photoEl.style.left = (x / dpr) + 'px'; photoEl.style.top = (y / dpr) + 'px';
    photoEl.style.width = (w / dpr) + 'px'; photoEl.style.height = (h / dpr) + 'px';

    const fx = Math.round(ox - tw * PADX), fy = Math.round(oy - tw * PADT);
    const fw = Math.round(gridW + 2 * tw * PADX), fh = Math.round(gridH + tw * (PADT + PADB));

    g.fillStyle = '#0B0B0B'; g.fillRect(fx, fy, fw, fh); g.restore();
    g.strokeStyle = '#1C1C1C'; g.lineWidth = Math.max(1, Math.round(tw * 0.02));

  function makeGlyph(v){
    const c = document.createElement('canvas'); c.width = tw; c.height = th;
    const g = c.getContext('2d');
    rr(g, 0, 0, tw, th, Math.max(1.5, tw * 0.07)); g.save(); g.clip();
    if (isColor(v)){
      g.fillStyle = COLORS[v[1]]; g.fillRect(0, 0, tw, th);
      const sh = g.createLinearGradient(0, 0, 0, th);
      sh.addColorStop(0, 'rgba(255,255,255,0.14)'); sh.addColorStop(0.5, 'rgba(255,255,255,0.02)');
      sh.addColorStop(0.5, 'rgba(0,0,0,0.04)'); sh.addColorStop(1, 'rgba(0,0,0,0.24)');
      g.fillStyle = sh; g.fillRect(0, 0, tw, th);
    } else {

      gr.addColorStop(0, '#242424'); gr.addColorStop(0.49, '#1B1B1B'); gr.addColorStop(0.51, '#141414'); gr.addColorStop(1, '#1B1B1B');
      g.fillStyle = gr; g.fillRect(0, 0, tw, th);

        const fs = Math.round(th * 0.58);
        g.font = FONT(fs); g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#F1F0EC';
        const mH = g.measureText('H');
        const capH = mH.actualBoundingBoxAscent || fs * 0.7;
        const by = Math.round(th / 2 + capH / 2);

        else g.fillText(v, tw / 2, by);

    }
    const hinge = Math.max(1, Math.round(th * 0.014));
    g.fillStyle = 'rgba(0,0,0,0.78)'; g.fillRect(0, Math.floor(th / 2) - Math.floor(hinge / 2), tw, hinge);
    g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(0, 0, tw, Math.max(1, Math.round(th * 0.01)));

    return c;
  }
  function drawTile(t){
    if (!glyphs) return;
    const x = ox + t.c * (tw + gx), y = oy + t.r * (th + gy);
    ctx.drawImage(bg, x - 1, y - 1, tw + 2, th + 2, x - 1, y - 1, tw + 2, th + 2);
    if (!t.anim || t.delay > 0 || t.p <= 0){ ctx.drawImage(glyphs[t.cur], x, y); return; }
    const A = glyphs[t.from], B = glyphs[t.to], hh = Math.floor(th / 2), hb = th - hh, p = t.p;
    ctx.drawImage(B, 0, 0, tw, hh, x, y, tw, hh);
    ctx.drawImage(A, 0, hh, tw, hb, x, y + hh, tw, hb);
    if (p < 0.5){
      const s = Math.cos(p * Math.PI), h = Math.max(1, Math.round(hh * s));
      ctx.drawImage(A, 0, 0, tw, hh, x, y + hh - h, tw, h);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.55 * (1 - s)).toFixed(3) + ')'; ctx.fillRect(x, y + hh - h, tw, h);
    } else {
      const s2 = -Math.cos(p * Math.PI), h2 = Math.max(1, Math.round(hb * s2));

      ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * (1 - s2)).toFixed(3) + ')'; ctx.fillRect(x, y + hh, tw, h2);
    }
  }
  function redrawAll(){ if (!bg) return; ctx.drawImage(bg, 0, 0); tiles.forEach(drawTile); }
  function frame(ts){
    if (!last) last = ts;

    let any = false;
    for (let i = 0; i < tiles.length; i++){
      const t = tiles[i];

      any = true;
      let step = dt;
      if (t.delay > 0){ t.delay -= dt; if (t.delay > 0) continue; step = -t.delay; t.delay = 0; }
      t.p += step / STEP;

        if (t.cur === t.target){ t.anim = false; t.p = 0; break; }

})();

/* =====================================================================
   PLAYER (rotation, featured screens, pin, show-now)
   ===================================================================== */
const Player = {
  seq: [], pos: -1, currentId: null, shownKey: '', dwell: null, token: null,
  held: false, flashing: false, flashNonce: undefined, dataKey: '', started: false,
  init: function(){
    const self = this;
    Store.on('data', function(){ self.onData(); });
    Store.on('flash', function(f){ self.onFlash(f); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight' || e.key === 'MediaTrackNext'){ self.flashing = false; self.next(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'MediaTrackPrevious'){ self.flashing = false; self.next(-1); }
    });
    setInterval(function(){ self.onData(); }, 60000);
    setInterval(function(){ Store.setNow(self.currentId); }, 60000);
    setTimeout(function(){ if (!self.started){ self.started = true; self.show(null); } }, 3500);
  },
  dur: function(m){ const s = Number(m && m.duration) || Number(S().seconds) || 15; return Math.min(600, Math.max(4, s)); },
  next: function(step){
    step = step || 1;
    clearTimeout(this.dwell);
    this.started = true;
    const hold = holdMsg();
    if (hold){ this.held = true; return this.show(hold, {held: true}); }
    this.held = false;
    if (!this.seq.length) this.seq = buildSeq();
    if (!this.seq.length){ this.pos = -1; return this.show(null); }
    let p = this.pos + step;
    if (p >= this.seq.length){
      this.seq = buildSeq();
      if (!this.seq.length){ this.pos = -1; return this.show(null); }
      if (this.seq.length > 1 && this.seq[0] === this.currentId) this.seq.push(this.seq.shift());
      p = 0;
    } else if (p < 0) p = this.seq.length - 1;
    this.pos = p;
    this.show(getMsg(this.seq[p]) || null);
  },
  show: function(m, opts){
    const self = this;
    opts = opts || {};
    clearTimeout(this.dwell);
    Board.hidePhoto();
    const res = layout(m || FALLBACK);
    this.currentId = m ? m.id : null;
    this.shownKey = showKey(m);
    Store.setNow(this.currentId);
    const token = {}; this.token = token;
    const photoReady = (m && res.photo) ? loadPhoto(m.image) : Promise.resolve(null);
    Board.setGrid(res.grid, function(){
      if (self.token !== token) return;
      photoReady.then(function(src){ if (self.token === token && src) Board.showPhoto(src, m.caption, res.photo); });
      if (opts.held) return;
      self.dwell = setTimeout(function(){
        if (self.token !== token) return;
        if (opts.onDone) opts.onDone();
        self.next(1);
      }, self.dur(m) * 1000);
    });
  },
  showFlash: function(m){
    const self = this;
    this.flashing = true;
    this.show(m, {onDone: function(){ self.flashing = false; }});
  },
  onData: function(){
    const key = JSON.stringify([Store.data.messages, Store.data.settings, todayStr()]);
    if (key === this.dataKey) return;
    this.dataKey = key;
    Board.setQuick(S().flip === 'quick');
    this.seq = buildSeq();
    const hold = holdMsg();
    if (hold){
      if (!this.held || this.currentId !== hold.id || showKey(hold) !== this.shownKey){
        this.held = true; this.flashing = false; this.show(hold, {held: true});
      }
      return;
    }
    if (this.held){ this.held = false; this.pos = -1; return this.next(1); }
    if (this.flashing){
      const fm = getMsg(this.currentId);
      if (fm && showKey(fm) !== this.shownKey) this.showFlash(fm);
      return;
    }
    if (!this.started) return this.next(1);
    this.pos = this.currentId ? this.seq.indexOf(this.currentId) : -1;
    const cur = getMsg(this.currentId);
    if (!cur || this.pos === -1) return this.next(1);
    if (showKey(cur) !== this.shownKey) this.show(cur);
  },
  onFlash: function(f){
    const nonce = f && f.nonce ? f.nonce : null;
    if (this.flashNonce === undefined){ this.flashNonce = nonce; return; }
    if (!nonce || nonce === this.flashNonce) return;
    this.flashNonce = nonce;
    const m = getMsg(f.id);
    if (!hasContent(m)) return;
    const hold = holdMsg();
    if (hold && hold.id === m.id) return;
    this.showFlash(m);
  }
};

/* ---------- keep the TV awake ---------- */
function keepAwake(){
  let lock = null;
  const v = $('#keepawake'), nudge = $('#nudge');
  const playVid = function(){ try { const p = v.play(); if (p && p.catch) p.catch(function(){}); } catch (e) {} };
  const req = function(){
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || lock) return;
    navigator.wakeLock.request('screen').then(function(l){ lock = l; l.addEventListener('release', function(){ lock = null; }); }).catch(function(){});
  };
  req(); playVid();
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible'){ req(); playVid(); } });
  ['click', 'keydown', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ req(); playVid(); }, {passive: true}); });
  let flip = 0;
  setInterval(function(){ req(); playVid(); flip = 1 - flip; nudge.style.transform = 'translateX(' + flip + 'px)'; }, 4 * 60 * 1000);
}

const pending = {}, saveTimers = {};

  const m = getMsg(id); if (!m) return null;
  m[f] = v;

  pending[id][f] = v;
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(function(){ flush(id); }, 450);
  return m;
}
function flush(id){
  clearTimeout(saveTimers[id]);
  const m = getMsg(id); if (!m){ delete pending[id]; return; }
  Object.assign(m, pending[id] || {}); delete pending[id];
  Store.saveMessage(m);
}
function miniHTML(res, m){

    const v = grid[r][c];
    h += isColor(v) ? '<i style="background:' + COLORS[v[1]] + '"></i>' : '<i>' + (v === ' ' ? '' : esc(v)) + '</i>';
  }
  if (res.photo && m && m.image){
    const P = res.photo;
    h += '<div class="mph" style="grid-column:' + (P.c0 + 1) + '/' + (P.c1 + 2) + ';grid-row:' + (P.r0 + 1) + '/' + (P.r1 + 2) + '"><img src="' + esc(photoUrl(m.image, 320)) + '" alt="" loading="lazy"></div>';

function statusOf(m){

      '<label>Seconds<input type="number" data-f="duration" min="4" max="300" inputmode="numeric" placeholder="' + S().seconds + '" value="' + esc(m.duration) + '"></label></div>' +
      '<div class="line"><span class="lbl">Layout</span>' + seg('style', m.style, [['banner','Header'],['rainbow','Rainbow'],['plain','Plain']]) + '</div>' +
      (m.style === 'banner' ? '<label><span class="lab">Header <span class="count">' + (m.header || '').length + '/22</span></span><input type="text" data-f="header" maxlength="22" autocomplete="off" placeholder="' + esc(t.header || 'HEADER') + '" value="' + esc(m.header) + '"></label>' : '') +
      '<label>Message<textarea data-f="body" rows="5" spellcheck="false" autocomplete="off">' + esc(m.body) + '</textarea></label>' +
      '<label><span class="lab">Photo <span class="count">' + (m.image ? 'shows on the right' : 'optional') + '</span></span><input type="text" data-f="image" inputmode="url" autocomplete="off" placeholder="' + (/^data:/i.test(m.image) ? 'Uploaded photo (paste a link to replace)' : 'Paste an image link') + '" value="' + (/^data:/i.test(m.image) ? '' : esc(m.image)) + '"></label>' +
      '<div class="line"><span class="lbl">Or upload a photo</span><span class="btns"><label class="filebtn">Upload<input type="file" accept="image/*" data-upload hidden></label>' + (m.image ? '<button type="button" data-act="nophoto">Remove</button>' : '') + '</span></div>' +
      (m.image ? '<label><span class="lab">Photo caption <span class="count">' + (m.caption || '').length + '/60</span></span><input type="text" data-f="caption" maxlength="60" autocomplete="off" placeholder="Short description under the photo" value="' + esc(m.caption) + '"></label>' : '') +
      '<div class="line"><span class="lbl">Add a color tile</span>' + sw('ins', '') + '</div>' +
      '<div class="warn' + (w ? ' show' : '') + '">' + esc(w) + '</div>' +
      (m.style === 'banner' ? '<div class="line"><span class="lbl">Header color</span>' + sw('acc', m.accent) + '</div>' : '') +
      '<div class="line"><span class="lbl">Align</span>' + seg('align', m.align, [['center','Center'],['left','Left']]) + '</div>' +
      '<div class="f2"><label>Starts<input type="date" data-f="start" value="' + esc(m.start) + '"></label><label>Ends<input type="date" data-f="end" value="' + esc(m.end) + '"></label></div>' +
      '<label class="row"><span>Featured, shows up more often</span><input type="checkbox" class="tog" data-f="featured"' + (m.featured ? ' checked' : '') + '></label>' +
      '<div class="actions"><button type="button" class="primary" data-act="flash">Show on TV now</button>' +
      '<button type="button" data-act="pin">' + (pinned ? 'Unpin' : 'Pin on TV') + '</button>' +
      '<button type="button" data-act="up">Move up</button><button type="button" data-act="down">Move down</button>' +
      '<button type="button" data-act="dup">Duplicate</button><button type="button" class="danger" data-act="del">Delete</button></div>' +
      '</div>';
  },
  refreshCard: function(card, m){
    const res = layout(m), st = statusOf(m);
    card.querySelector('.mini').innerHTML = miniHTML(res, m);
    const w = card.querySelector('.warn');
    if (w){ const txt = warnText(m, res); w.textContent = txt; w.classList.toggle('show', !!txt); }
    const hc = card.querySelector('input[data-f=header]'); if (hc) hc.closest('label').querySelector('.count').textContent = (m.header || '').length + '/22';
    const cc = card.querySelector('input[data-f=caption]'); if (cc) cc.closest('label').querySelector('.count').textContent = (m.caption || '').length + '/60';
    card.querySelector('.status').textContent = st[1];
    card.classList.remove('st-live', 'st-off', 'st-sched', 'st-ended', 'st-empty'); card.classList.add('st-' + st[0]);
    const f = card.querySelector('.chip.feat'); if (f) f.hidden = !m.featured;
  },
  onInput: function(e){
    const el = e.target, f = el.dataset.f;
    if (!f || el.type === 'checkbox' || el.tagName === 'SELECT') return;
    const card = el.closest('.card'), id = card.dataset.id;
    let v = el.value;
    if (f === 'duration') v = el.value === '' ? '' : Math.min(600, Math.max(1, Math.round(Number(el.value) || 0))) || '';
    const m = editField(id, f, v);
    if (m) this.refreshCard(card, m);
  },
  onChange: function(e){
    const el = e.target, f = el.dataset.f;
    if (el.hasAttribute && el.hasAttribute('data-upload')){ this.upload(el); return; }
    if (!f) return;
    const card = el.closest('.card'), id = card.dataset.id;
    if (f === 'image'){ flush(id); this.render(); return; }
    if (f === 'type'){
      const t = TYPES[el.value];
      editField(id, 'type', el.value); editField(id, 'style', t.style); editField(id, 'accent', t.accent); editField(id, 'header', '');
      flush(id); this.render(); return;
    }
    if (el.type === 'checkbox'){
      const m = editField(id, f, el.checked); flush(id);
      if (m) this.refreshCard(card, m);
      return;
    }
    if (el.type === 'date' || el.type === 'number') flush(id);
  },
  onClick: function(e){
    const self = this;
    const card = e.target.closest('.card'); if (!card) return;
    const id = card.dataset.id, m = getMsg(id); if (!m) return;
    if (e.target.closest('.tog')) return;
    const ins = e.target.closest('[data-ins]');
    if (ins){
      const ta = card.querySelector('textarea[data-f=body]');
      const s = typeof ta.selectionStart === 'number' ? ta.selectionStart : ta.value.length;
      const en = typeof ta.selectionEnd === 'number' ? ta.selectionEnd : s;
      ta.value = ta.value.slice(0, s) + '{' + ins.dataset.ins + '}' + ta.value.slice(en);
      ta.focus(); ta.setSelectionRange(s + 3, s + 3);
      ta.dispatchEvent(new Event('input', {bubbles: true}));
      return;
    }
    const acc = e.target.closest('[data-acc]');
    if (acc){ editField(id, 'accent', acc.dataset.acc); flush(id); this.render(); return; }
    const sty = e.target.closest('[data-style]');
    if (sty){ editField(id, 'style', sty.dataset.style); flush(id); this.render(); return; }
    const al = e.target.closest('[data-align]');
    if (al){ editField(id, 'align', al.dataset.align); flush(id); this.render(); return; }
    const act = e.target.closest('[data-act]');
    if (act){
      const a = act.dataset.act;
      if (a === 'flash'){
        flush(id);
        if (!hasContent(m)) return toast('Add a message first');
        Store.sendFlash(id);
        toast(Store.mode === 'local' ? 'Showing on the board in this browser' : 'Sent to the TV');
      } else if (a === 'pin'){
        flush(id);
        const pinned = S().holdId === id;
        this.saveSetting({holdId: pinned ? '' : id});
        toast(pinned ? 'Unpinned' : 'Pinned on the TV');
      } else if (a === 'up' || a === 'down'){
        this.move(id, a === 'up' ? -1 : 1);
      } else if (a === 'dup'){
        flush(id);
        const copy = cleanMsg(Object.assign({}, m, {id: newId()}));
        Store.data.messages[copy.id] = copy;
        const list = sortedMessages().filter(function(x){ return x.id !== copy.id; });
        list.splice(list.indexOf(m) + 1, 0, copy);
        this.saveOrder(list, copy.id);
        this.expanded = copy.id; this.render(); this.scrollTo(copy.id);
        toast('Duplicated');
      } else if (a === 'nophoto'){
        editField(id, 'image', ''); flush(id); this.render();
      } else if (a === 'del'){
        if (!window.confirm('Delete this screen?')) return;
        delete pending[id]; clearTimeout(saveTimers[id]);
        if (S().holdId === id) Store.saveSettings(Object.assign({}, S(), {holdId: ''}));
        Store.removeMessage(id);
        if (this.expanded === id) this.expanded = null;
        this.render(); toast('Deleted');
      }
      return;
    }
    if (e.target.closest('.card-top')){
      this.expanded = this.expanded === id ? null : id;
      this.render();
      if (this.expanded) this.scrollTo(id);
    }
  },
  upload: function(input){
    const self = this, file = input.files && input.files[0];
    const card = input.closest('.card'); if (!file || !card) return;
    const id = card.dataset.id;
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function(){
      const max = 720, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      let q = 0.82, data = c.toDataURL('image/jpeg', q);
      while (data.length > 180000 && q > 0.45){ q -= 0.1; data = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      editField(id, 'image', data); flush(id); self.render(); toast('Photo added');
    };
    im.onerror = function(){ URL.revokeObjectURL(url); toast("That photo couldn't be read"); };
    im.src = url;
  },
  scrollTo: function(id){
    const c = this.list.querySelector('.card[data-id="' + id + '"]');
    if (c && c.scrollIntoView) c.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  },
  saveOrder: function(list, forceId){
    list.forEach(function(x, i){ if (x.order !== i || x.id === forceId){ x.order = i; Store.saveMessage(x); } });
  },
  move: function(id, dir){
    const list = sortedMessages();
    const i = list.findIndex(function(x){ return x.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    flush(id);
    const t = list[i]; list[i] = list[j]; list[j] = t;
    this.saveOrder(list);
    this.render(); this.scrollTo(id);
  },
  add: function(type){
    const t = TYPES[type];
    const m = cleanMsg({id: newId(), type: type, style: t.style, accent: t.accent, header: '', body: '', active: true, featured: type === 'deal', order: -1});
    Store.data.messages[m.id] = m;
    const list = [m].concat(sortedMessages().filter(function(x){ return x.id !== m.id; }));
    this.saveOrder(list, m.id);
    this.expanded = m.id; this.render(); this.scrollTo(m.id);
    const ta = this.list.querySelector('.card[data-id="' + m.id + '"] textarea');
    if (ta) ta.focus();
  }
};

/* ---------- start ---------- */
if (IS_EDITOR){
  document.body.classList.add('edit-mode');
  $('#board-view').remove();
  $('#editor').hidden = false;
  const unlock = function(){
    $('#gate').remove(); $('#ed-main').hidden = false;
    Editor.init(); Store.init();
  };
  let ok = false;
  try { ok = sessionStorage.getItem('sohoFloorPin') === PIN; } catch (e) {}
  if (ok) unlock();
  else {
    $('#ed-status').hidden = true;
    $('#gateForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      if ($('#pinInput').value.trim().toUpperCase() === PIN){
        try { sessionStorage.setItem('sohoFloorPin', PIN); } catch (e) {}
        $('#ed-status').hidden = false; unlock();
      } else $('#gateMsg').textContent = "That PIN didn't match. Try again.";
    });
    $('#pinInput').focus();
  }
} else {
  document.body.classList.add('board-mode');
  $('#editor').remove();
  keepAwake();
  Store.on('status', function(s){ $('#dot').classList.toggle('on', s === 'live'); });
  Board.init().then(function(){ Player.init(); Store.init(); });
}
})();
</script>
